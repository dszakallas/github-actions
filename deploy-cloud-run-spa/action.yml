name: 'Deploy SPA Cloud Run App'
description: 'Deploy pre-built Single Page Application (SPA) static assets to Google Cloud Storage using Workload Identity Federation'
author: 'Dávid Szakállas'

inputs:
  workload_identity_provider:
    description: 'Workload Identity Provider resource name (e.g. projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider)'
    required: true
  service_account:
    description: 'Service Account email to impersonate for Google Cloud authentication'
    required: true
  bucket:
    description: 'Target Google Cloud Storage bucket or destination path (e.g. "my-bucket" or "gs://my-bucket/dist/app")'
    required: true
  source_dir:
    description: 'Local directory containing the built static files to deploy'
    required: false
    default: 'dist'
  delete_unmatched:
    description: 'Whether to delete objects in the destination bucket that do not exist in source'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3

    - name: Deploy static assets to GCS
      shell: bash
      env:
        INPUT_BUCKET: ${{ inputs.bucket }}
        INPUT_SOURCE_DIR: ${{ inputs.source_dir }}
        INPUT_DELETE_UNMATCHED: ${{ inputs.delete_unmatched }}
      run: |
        if [ -z "$INPUT_BUCKET" ]; then
          echo "::error::Target bucket input is required" >&2
          exit 1
        fi

        if [ ! -d "$INPUT_SOURCE_DIR" ]; then
          echo "::error::Source directory '$INPUT_SOURCE_DIR' does not exist" >&2
          exit 1
        fi

        DEST="${INPUT_BUCKET#gs://}"
        DEST="gs://${DEST}"

        FLAGS=("--recursive")
        if [ "$INPUT_DELETE_UNMATCHED" = "true" ]; then
          FLAGS+=("--delete-unmatched-destination-objects")
        fi

        echo "Deploying from '${INPUT_SOURCE_DIR}' to '${DEST}'..."
        gcloud storage rsync "${FLAGS[@]}" "$INPUT_SOURCE_DIR" "$DEST"
